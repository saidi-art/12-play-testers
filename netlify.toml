[build]
  publish = "."

# Legacy agent availability path: 301 to the canonical file (brief item 3)
[[redirects]]
  from = "/api/availability.json"
  to = "/availability.json"
  status = 301
  force = true

# Planned API and MCP stubs served as JSON at the directory root (brief item 4)
[[redirects]]
  from = "/api"
  to = "/api/index.json"
  status = 200
  force = true

[[redirects]]
  from = "/api/"
  to = "/api/index.json"
  status = 200
  force = true

[[redirects]]
  from = "/mcp"
  to = "/mcp/index.json"
  status = 200
  force = true

[[redirects]]
  from = "/mcp/"
  to = "/mcp/index.json"
  status = 200
  force = true

# Content negotiation: text/markdown on the home page gets the markdown twin (brief item 1)
[[edge_functions]]
  function = "markdown-negotiate"
  path = "/"

# A2A Agent Card: A2A v1.0 well-known discovery + open CORS (phase 1, 11 Nov pack)
[[headers]]
  for = "/.well-known/agent-card.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Accept, Content-Type, A2A-Version, A2A-Extensions"
    Cache-Control = "public, max-age=3600"

# /a2a: declared interface URL, served by the a2a function (phase 1 minimal stub)
[[redirects]]
  from = "/a2a"
  to = "/.netlify/functions/a2a"
  status = 200
  force = true

[[redirects]]
  from = "/a2a/"
  to = "/.netlify/functions/a2a"
  status = 200
  force = true

[[headers]]
  for = "/a2a"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS, POST"
    Access-Control-Allow-Headers = "Accept, Content-Type, A2A-Version, A2A-Extensions"
